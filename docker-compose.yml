# Postgres para desarrollo y tests: docker compose up -d
# (En producción la base la da Railway por DATABASE_URL)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: manolito
      POSTGRES_PASSWORD: manolito
      POSTGRES_DB: manolito
    ports:
      - "127.0.0.1:5434:5432" # 5434: el 5432 suele estar ocupado por otros proyectos
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
